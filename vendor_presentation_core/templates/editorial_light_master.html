<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editorial Light Master</title>
  <style>
    html, body {
      width: 1280px;
      height: 720px;
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(188, 147, 72, 0.18), transparent 32%),
        linear-gradient(180deg, #f7f5ef 0%, #f4f6f9 100%);
      color: #122033;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide {
      width: 1180px;
      height: 620px;
      display: grid;
      grid-template-rows: 110px 1fr 70px;
      gap: 18px;
      padding: 28px 30px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: 0 24px 80px rgba(15, 23, 42, 0.12);
      border: 1px solid rgba(18, 32, 51, 0.08);
    }
    .header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      border-bottom: 1px solid rgba(18, 32, 51, 0.12);
      padding-bottom: 14px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(201, 151, 77, 0.12);
      color: #7d5a22;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .title {
      margin: 14px 0 0;
      font-size: 38px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 8px 0 0;
      color: #4b5b70;
      font-size: 15px;
      line-height: 1.4;
    }
    .page-tag {
      align-self: start;
      padding: 10px 14px;
      border-radius: 14px;
      background: #122033;
      color: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .content {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      min-height: 0;
    }
    .panel {
      min-height: 0;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(18, 32, 51, 0.08);
      box-shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
      padding: 22px;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 8px;
      color: #5a6879;
      font-size: 12px;
      border-top: 1px solid rgba(18, 32, 51, 0.1);
    }
  </style>
</head>
<body>
  <div class="slide">
    <header class="header">
      <div>
        <div class="eyebrow">Signal Narrative</div>
        <h1 class="title">{{ page_title }}</h1>
        <p class="subtitle">{{ page_content }}</p>
      </div>
      <div class="page-tag">{{ current_page_number }}/{{ total_page_count }}</div>
    </header>
    <main class="content">
      <section class="panel"></section>
      <section class="panel"></section>
    </main>
    <footer class="footer">
      <span>Editorial Light Master</span>
      <span>{{ current_page_number }}</span>
    </footer>
  </div>
</body>
</html>
