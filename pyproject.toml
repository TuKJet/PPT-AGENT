[project]
name = "ppt-deck-workflow-agent"
version = "0.1.0"
description = "Codex-facing PPT deck workflow with shared planning and HTML/SVG renderer branches."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "python-pptx>=1.0.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
ppt-deck-workflow = "ppt_workflow.runner:main"

[tool.uv]
package = false
